name: build mediawiki

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 1,15 * *" # bi-weekly on 1st and 15th calendar day at 17:00
  push:
    branches:
      - main
    paths:
      - mediawiki/**

permissions:
  actions: read
  packages: write

concurrency:
  group: mediawiki-${{ github.ref }}-1
  cancel-in-progress: true

jobs:
  push:
    name: "mediawiki_1.44"
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout for Github repository workspace
        uses: actions/checkout@v4

      - name: Setup QEMU for multiarch builds
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./mediawiki
          platforms: linux/amd64, linux/arm64
          file: ./mediawiki/1.44/Dockerfile
          push: true
          tags: ghcr.io/leafdtk/images:mediawiki_1.44